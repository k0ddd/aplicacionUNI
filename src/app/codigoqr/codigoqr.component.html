<ion-content color="rosado">
  <ion-accordion-group>
    <ion-accordion *ngFor="let card of cards" [value]="card.idClase" toggleIcon="caret-down-circle" toggleIconSlot="start">
      <ion-item slot="header" color="amarillo">
        <ion-label>{{ card.titulo }}</ion-label>
      </ion-item>
      <div class="ion-padding" slot="content" color="rosado">
        <!-- Botón que genera el código QR con los datos de la clase -->
        <ion-button shape="round" color="boton" (click)="generarCodigoQR(card)">
          Generar Código QR
        </ion-button>

        <!-- Mostrar el QR cuando haya datos -->
        <div *ngIf="qrData">
          <qrcode [qrdata]="qrData" [width]="256" [errorCorrectionLevel]="'M'"></qrcode>
        </div>
      </div>
    </ion-accordion>
  </ion-accordion-group>
</ion-content>
